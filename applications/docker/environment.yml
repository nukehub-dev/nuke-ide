# Conda environment for NukeIDE's Python backends.
# Python 3.13, OpenMC + headless VTK converters + CAD toolchain.
#
# Used by applications/docker/Dockerfile; can also be created locally:
#   conda env create -f applications/docker/environment.yml
name: ide
channels:
  - conda-forge
dependencies:
  - python=3.13
  - nodejs=22
  - pip
  # Core scientific stack
  - numpy
  - scipy
  - h5py
  - matplotlib
  - pandas
  - pyyaml
  # Visualization (headless converters in the nuke-visualizer extension:
  # numpy geometry -> XML VTK files via the `vtk` package, rendered
  # client-side by the IDE's native three.js viewers). Everything comes
  # from conda so the whole stack shares conda's vtk.
  - vtk
  - python-multipart
  # CAD import/conversion (openmc-studio cad_conversion). Conda cadquery pulls
  # conda ocp and links conda's vtk — never install pip cadquery/cadquery-ocp/
  # cadquery_vtk here: their vtkmodules builds clobber conda's vtk files.
  - python-gmsh
  - cadquery
  # nuke-cad full profile: meshio for CalculiX/VTK mesh export, netCDF4 for the
  # custom ExodusII writer, plus build123d's pure-Python dependencies. build123d
  # itself is deliberately NOT a conda dependency here: a conda build123d
  # would pull an OCP flavor incompatible with this env's OCP stack (OCP
  # 7.9 removed the TopoDS `*_s` downcast statics build123d 0.9.1 uses).
  # Instead the
  # Dockerfile installs build123d==0.9.1 via `pip install --no-deps` (pure
  # Python — no binary wheels, so it cannot clobber conda's stack) and activates
  # nuke-cad's OCP 7.9 alias shim (extensions/nuke-cad/python/ocp_compat.py)
  # through a site-packages .pth file. Never add `build123d` back as a conda dep
  # here, and never pip-install it with deps (that drags in the cadquery-ocp
  # wheel, which shadows conda's OCP module). ocpsvg is pip-installed --no-deps
  # for the same reason: conda ocpsvg 0.5.0 requires ocp <7.9, so the solver
  # would walk back to the ancient 0.2.1, while pip 0.6.0 targets OCP 7.9.
  - svgpathtools
  - svgelements
  - anytree
  - ezdxf
  - trianglesolver
  - meshio
  - netCDF4
  # netgen/ngsolve stay optional and are intentionally not installed, for two
  # confirmed reasons: conda netgen and conda OCP register the same OCCT types
  # with pybind11 in one process ("type gp_Pnt is already registered!" in either
  # import order, and build123d+netgen breaks too), and the pip ngsolve wheel
  # (netgen-occt) dumps its own OCCT 7.8.1 .so files into the env's lib/,
  # clobbering conda's occt (empirically confirmed: cadquery import broke with
  # undefined-symbol errors until the pip packages were removed and conda occt
  # force-reinstalled). The netgen mesh engine is an opt-in alternative to the
  # default gmsh path; run its tests in a pip-OCP env (pip cadquery-ocp + pip
  # ngsolve coexist fine).
  # OpenCASCADE bindings: pythonocc-core provides the OCC module
  - pythonocc-core
  - pip:
      # DAGMC workflows (pinned commit for reproducible builds)
      - pydagmc @ git+https://github.com/svalinn/pydagmc@4afa678d24aa091417798ef4b3d11fda98b165f8
      # OpenMC (openmc-studio) and MOAB/pymoab wheels — published on this
      # community index, not PyPI; same extra index the nuke-core health checks
      # use (see nuke-core docs/dev/service-api.md). The openmc wheel bundles
      # libopenmc and the DAGMC-enabled openmc executable, so the conda-forge
      # package is intentionally not used — the env stays reproducible from
      # pip alone for test environments. Unpinned: the index carries a single
      # current release (weekly CI smoke builds catch a bad new drop).
      - --extra-index-url https://shimwell.github.io/wheels
      - openmc
      - moab
      # build123d dependency that is not on conda-forge (pure Python, zero
      # deps of its own); build123d itself is installed --no-deps by the
      # Dockerfile, see environment.yml's CAD comment.
      - py-lib3mf
      # Convenience for interactive sessions (build123d declares ipython<9)
      - 'ipython<9'
