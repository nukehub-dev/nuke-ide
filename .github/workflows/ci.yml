name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT

      - name: Cache node_modules
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            applications/*/node_modules
            extensions/*/node_modules
            ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ci-yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ci-yarn-${{ runner.os }}-
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-scripts

      - name: Prettier
        run: yarn format:check

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff
        run: yarn lint:python

  typecheck:
    name: Build Extensions (tsc)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT

      - name: Cache node_modules
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            applications/*/node_modules
            extensions/*/node_modules
            ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ci-yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ci-yarn-${{ runner.os }}-
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-scripts

      - name: Compile all extensions
        run: npx lerna run build

  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache test env
        uses: actions/cache@v6
        id: test-env-cache
        with:
          path: /usr/share/miniconda3/envs/nuke-test
          key: nuke-test-env-${{ runner.os }}-v1

      # Full-dependency profile: openmc is conda-forge-only (not PyPI), and
      # h5py/vtk unblock the importorskip integration tests, so the coverage
      # ratchet measures the real test profile (matching local full runs).
      # python is pinned explicitly — openmc 0.15.3 supports up to 3.13.
      - name: Create full test env (conda-forge)
        if: steps.test-env-cache.outputs.cache-hit != 'true'
        run: conda create -y -n nuke-test -c conda-forge --strict-channel-priority python=3.13 openmc h5py vtk pytest pytest-cov numpy

      - name: Run Python tests with coverage
        # Logic-layer coverage is ratcheted (fail_under in .coveragerc);
        # the rendering layer is excluded by design (see .coveragerc).
        run: conda run -n nuke-test python -m pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Coverage summary
        if: always()
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: coverage.xml
          badge: true
          fail_below_min: false
          format: markdown
          hide_branch_rate: true
          hide_complexity: true
          indicators: true
          output: both
          thresholds: '60 90'

  ts-tests:
    name: TypeScript Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT

      - name: Cache node_modules
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            applications/*/node_modules
            extensions/*/node_modules
            ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ci-yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ci-yarn-${{ runner.os }}-
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-scripts

      # vitest imports compiled sibling packages (nuke-core/lib/...); --ignore-scripts skips the
      # lerna prepare build, so extensions must be compiled explicitly before running tests.
      - name: Compile extensions
        run: npx lerna run build

      - name: Run vitest
        run: yarn test:ts
