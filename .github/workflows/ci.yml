name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT

      - name: Cache node_modules
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            applications/*/node_modules
            extensions/*/node_modules
            ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ci-yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ci-yarn-${{ runner.os }}-
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-scripts

      - name: Prettier
        run: yarn format:check

      - name: Docs screenshot manifest
        run: yarn docs:screenshots:check

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff
        run: yarn lint:python

  typecheck:
    name: Build Extensions (tsc)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT

      - name: Cache node_modules
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            applications/*/node_modules
            extensions/*/node_modules
            ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ci-yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ci-yarn-${{ runner.os }}-
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-scripts

      - name: Compile all extensions
        run: npx lerna run build

  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # GitHub-hosted runners do not ship conda on PATH; setup-miniconda
      # installs Miniforge and exports $CONDA for the cache below.
      - name: Set up conda
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          activate-environment: ''

      # Conda envs embed their own prefix in script shebangs, so the cache key
      # must change whenever the prefix or package set changes.
      - name: Cache test env
        uses: actions/cache@v6
        id: test-env-cache
        with:
          path: ${{ env.CONDA }}/envs/ide
          key: nuke-test-env-${{ runner.os }}-v3-${{ hashFiles('applications/docker/environment.yml') }}

      # Same full CAD/OpenMC environment as the Docker image so the nuke-cad
      # suites run instead of skipping and the 94% ratchet measures the real
      # test profile. The environment file pins python=3.13.
      - name: Create full test env
        if: steps.test-env-cache.outputs.cache-hit != 'true'
        run: conda env create -f applications/docker/environment.yml

      # build123d is deliberately absent from the conda env (see the CAD
      # comment in environment.yml): install it --no-deps and activate the
      # OCP 7.9 alias shim, mirroring the Dockerfile and upstream-latest.
      - name: Install build123d and test tools
        run: |
          SP="$CONDA/envs/ide/lib/python3.13/site-packages"
          cp extensions/nuke-cad/python/ocp_compat.py "$SP/ocp_compat.py"
          echo 'import ocp_compat; ocp_compat.install_build123d_import_hook()' > "$SP/_nuke_ocp79.pth"
          "$CONDA/envs/ide/bin/pip" install -q --no-deps build123d==0.9.1 ocpsvg==0.6.0
          "$CONDA/envs/ide/bin/pip" install -q pytest pytest-cov

      - name: Run Python tests with coverage
        # Logic-layer coverage is ratcheted (fail_under in .coveragerc);
        # the rendering layer is excluded by design (see .coveragerc).
        run: |
          "$CONDA/envs/ide/bin/python" -m pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Coverage summary
        if: always() && hashFiles('coverage.xml') != ''
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: coverage.xml
          badge: true
          fail_below_min: false
          format: markdown
          hide_branch_rate: true
          hide_complexity: true
          indicators: true
          output: both
          thresholds: '60 90'

  ts-tests:
    name: TypeScript Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT

      - name: Cache node_modules
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            applications/*/node_modules
            extensions/*/node_modules
            ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ci-yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ci-yarn-${{ runner.os }}-
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-scripts

      # vitest imports compiled sibling packages (nuke-core/lib/...); --ignore-scripts skips the
      # lerna prepare build, so extensions must be compiled explicitly before running tests.
      - name: Compile extensions
        run: npx lerna run build

      - name: Run vitest
        run: yarn test:ts
