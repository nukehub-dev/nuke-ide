name: Build NukeIDE

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm libx11-dev libxkbfile-dev

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT

      - name: Cache node_modules
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            applications/*/node_modules
            extensions/*/node_modules
            ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock', 'applications/electron/package.json') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Cache Electron
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('applications/electron/package.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Cache plugins
        uses: actions/cache@v6
        with:
          path: plugins
          key: ${{ runner.os }}-plugins-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-plugins-

      - name: Install dependencies
        run: yarn install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rebuild native modules
        # A restored node_modules cache may predate a dependency bump or come
        # from a scriptless install; make sure the .node binaries exist.
        run: |
          for mod in cpu-features keytar; do
            if [ -d "node_modules/$mod" ]; then
              (cd "node_modules/$mod" && npm run install --silent)
            fi
          done
          # @theia/ffmpeg has no install script — yarn/npm compile its
          # binding.gyp via the implicit node-gyp install, which scriptless
          # caches lack. `theia build`'s checkFfmpeg loads ffmpeg.node.
          (cd node_modules/@theia/ffmpeg && npx node-gyp rebuild)

      - name: Download Electron binary
        run: node node_modules/electron/install.js

      - name: Build Electron app
        run: yarn build:electron:prod

      - name: Package Electron app
        # --publish never: electron-builder must not create/upload the GitHub
        # release itself (its token has no contents:write, and three platform
        # jobs would race). The release job below drafts it from artifacts.
        run: yarn --cwd applications/electron dist --publish never

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v7
        with:
          name: NukeIDE-Linux
          path: |
            applications/electron/dist/*.AppImage
            applications/electron/dist/*.deb
            applications/electron/dist/*.rpm
          if-no-files-found: warn

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn cache dir)" >> $env:GITHUB_OUTPUT

      - name: Cache node_modules
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            applications/*/node_modules
            extensions/*/node_modules
            ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock', 'applications/electron/package.json') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Cache Electron
        uses: actions/cache@v6
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('applications/electron/package.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Cache plugins
        uses: actions/cache@v6
        with:
          path: plugins
          key: ${{ runner.os }}-plugins-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-plugins-

      - name: Install dependencies
        run: yarn install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Electron binary
        run: node node_modules/electron/install.js

      - name: Build Electron app
        run: yarn build:electron:prod

      - name: Package Electron app
        # --publish never: electron-builder must not create/upload the GitHub
        # release itself (its token has no contents:write, and three platform
        # jobs would race). The release job below drafts it from artifacts.
        run: yarn --cwd applications/electron dist --publish never

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: NukeIDE-Windows
          path: |
            applications/electron/dist/*.exe
          if-no-files-found: warn

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT

      - name: Cache node_modules
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            applications/*/node_modules
            extensions/*/node_modules
            ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock', 'applications/electron/package.json') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Cache Electron
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('applications/electron/package.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Cache plugins
        uses: actions/cache@v6
        with:
          path: plugins
          key: ${{ runner.os }}-plugins-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-plugins-

      - name: Install dependencies
        run: yarn install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Electron binary
        run: node node_modules/electron/install.js

      - name: Build Electron app
        run: yarn build:electron:prod
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Package Electron app
        # --publish never: electron-builder must not create/upload the GitHub
        # release itself (its token has no contents:write, and three platform
        # jobs would race). The release job below drafts it from artifacts.
        run: yarn --cwd applications/electron dist --publish never

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: NukeIDE-macOS
          path: |
            applications/electron/dist/*.dmg
            applications/electron/dist/*.zip
          if-no-files-found: warn

  release:
    name: Create GitHub Release
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout
        # Needed for CHANGELOG.md (the release body is extracted from it).
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lah artifacts/

      - name: Extract release notes from CHANGELOG.md
        # The release body is the curated changelog section for this tag.
        # GitHub's auto-generated notes are PR-based and useless for this
        # trunk-based repo (direct commits, no PR labels).
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { found=1; next }
            found && /^## \[/ { exit }
            found && /^\[/ { exit }
            found
          ' CHANGELOG.md | sed '/./,$!d' > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No curated CHANGELOG.md section found for $VERSION — see the commit log." > release-notes.md
          fi
          cat release-notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**
          draft: true
          body_path: release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
