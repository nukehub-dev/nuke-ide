name: UI smoke

# Playwright GUI smoke tests (tests/ui/) against the built browser app:
# boots the real Theia frontend in Chromium and checks for console errors,
# blank widgets, and interaction regressions (see .crush/PHASE9_PLAN.md P9A).
# Weekly only — the browser bundle is too heavy for per-PR gating.

on:
  schedule:
    # Weekly (Tuesdays ~05:41 UTC), staggered from the other weekly jobs.
    - cron: '41 5 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright:
    name: Playwright GUI smoke tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT

      - name: Cache node_modules
        # Own prefix: must NOT collide with ci.yml's ci-yarn- caches, which
        # are created with --ignore-scripts (repo cache-prefix pitfall).
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            applications/*/node_modules
            extensions/*/node_modules
            ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ui-smoke-yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ui-smoke-yarn-${{ runner.os }}-

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-scripts

      - name: Compile extensions
        # --ignore-scripts skips the lerna prepare build, so extensions must
        # be compiled explicitly: webpack resolves sibling packages via
        # <extension>/lib/... (same reason as ci.yml's Compile steps). Without
        # this the bundle fails with `Can't resolve 'nuke-*/lib/...'`.
        run: npx lerna run build

      - name: Rebuild native modules
        # Scriptless installs skip native builds; webpack fails resolving
        # keytar.node / cpufeatures.node / drivelist.node without them
        # (same pitfall as build.yml's Rebuild step, which covers the
        # Electron bundle — the browser bundle needs them too).
        run: |
          for mod in cpu-features keytar drivelist; do
            if [ -d "node_modules/$mod" ]; then
              (cd "node_modules/$mod" && npm run install --silent)
            fi
          done
          # @theia/ffmpeg has no install script — yarn/npm compile its
          # binding.gyp via the implicit node-gyp install, which scriptless
          # caches lack. `theia build`'s checkFfmpeg loads ffmpeg.node.
          if [ -d "node_modules/@theia/ffmpeg" ]; then
            (cd node_modules/@theia/ffmpeg && npx node-gyp rebuild)
          fi

      - name: Build the browser app
        run: yarn build:browser

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright suite
        run: yarn test:ui

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
